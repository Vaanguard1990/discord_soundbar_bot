<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soundboard · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0a0c0f; --panel:#111418; --border:#1e2530;
    --accent:#00ff88; --discord:#5865f2; --danger:#ff3b5c;
    --text:#d4dce8; --text-dim:#5a6a80;
    --font-mono:'Share Tech Mono',monospace;
    --font-ui:'Barlow Condensed',sans-serif;
    --glow:0 0 12px rgba(0,255,136,0.4);
    --glow-d:0 0 12px rgba(88,101,242,0.5);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;display:grid;place-items:center;overflow:hidden;position:relative}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);pointer-events:none;z-index:999}
  body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.5) 100%);pointer-events:none}

  .login-box{width:400px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:36px 32px;position:relative;z-index:1}
  .logo{text-align:center;margin-bottom:30px}
  .logo-icon{width:56px;height:56px;background:var(--accent);border-radius:10px;display:inline-grid;place-items:center;font-size:28px;color:#000;box-shadow:var(--glow);margin-bottom:12px}
  .logo-text{font-size:24px;font-weight:900;letter-spacing:6px;color:var(--accent);text-shadow:var(--glow)}
  .logo-sub{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:3px;margin-top:4px}

  .description{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);line-height:1.7;text-align:center;margin-bottom:24px;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:6px}
  .description strong{color:var(--text)}

  .discord-btn{width:100%;background:var(--discord);color:#fff;border:none;border-radius:6px;padding:16px;font-family:var(--font-ui);font-size:15px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none}
  .discord-btn:hover{box-shadow:var(--glow-d);transform:translateY(-2px)}
  .discord-btn:active{transform:scale(0.98)}
  .discord-btn svg{width:22px;height:22px;fill:currentColor}

  .error{background:rgba(255,59,92,0.1);border:1px solid var(--danger);color:var(--danger);padding:10px 14px;border-radius:6px;font-family:var(--font-mono);font-size:12px;margin-bottom:16px;display:none}
  .error.show{display:block}

  .footer-info{text-align:center;margin-top:24px;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:2px}
  .secure-badge{display:inline-flex;align-items:center;gap:4px;color:var(--accent)}

  .cursor::after{content:'_';animation:blink 1s step-start infinite;color:var(--accent)}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>

<div class="login-box">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">SOUNDBOARD</div>
    <div class="logo-sub cursor">SECURE LOGIN</div>
  </div>

  <div class="error" id="error"></div>

  <div class="description">
    Accedi con il tuo account Discord per usare la soundboard<br>
    nei server in cui sei <strong>autorizzato</strong>.
  </div>

  <a href="/api/oauth/start" class="discord-btn">
    <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
    Login con Discord
  </a>

  <div class="footer-info">
    <span class="secure-badge" id="secBadge">🔓 HTTP</span>
    &nbsp;·&nbsp;
    OAUTH 2.0
  </div>
</div>

<script>
  if (location.protocol === 'https:') {
    document.getElementById('secBadge').innerHTML = '🔒 HTTPS';
  }
  // Mostra errore se presente in query
  const params = new URLSearchParams(location.search);
  const err = params.get('err');
  if (err) {
    const box = document.getElementById('error');
    const messages = {
      denied: 'Autorizzazione negata',
      state:  'Sessione scaduta, riprova',
      oauth:  'Errore nel flow OAuth',
    };
    box.textContent = '❌ ' + (messages[err] || 'Errore di login');
    box.className = 'error show';
  }
</script>
</body>
</html>
